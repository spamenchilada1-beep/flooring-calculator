name: Notify IndexNow

on:
  push:
    branches:
      - main
    paths:
      - "index.html"
      - "src/**"
      - "public/**"
      - "package.json"
      - "sitemap.xml"

jobs:
  indexnow:
    runs-on: ubuntu-latest
    steps:
      - name: Notify IndexNow of updated pages
        env:
          INDEXNOW_KEY: d9cd694e5449b0b1fe7f9bff6241d9d4
        run: |
          sleep 60
          urls=(
            "https://flooring-calculator.pages.dev/"
            "https://flooring-calculator.pages.dev/flooring-calculator-square-feet"
            "https://flooring-calculator.pages.dev/how-many-boxes-of-flooring"
            "https://flooring-calculator.pages.dev/flooring-waste-calculator"
          )
          for url in "${urls[@]}"; do
            code=$(curl -sS -G -o /dev/null -w "%{http_code}" \
              "https://api.indexnow.org/indexnow" \
              --data-urlencode "url=$url" \
              --data-urlencode "key=$INDEXNOW_KEY")
            echo "$code $url"
          done
